<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #fff; --text: #1c2026; --muted: #6b7280; --grid: #e3e6ea;
    --border: #d4d8de; --accent: #2b6cb0; --accent-text: #fff;
    --x: #d9363e; --y: #1f9d55; --z: #2b6cb0; --sp: #1c2026;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1d2128; --text: #e6e8eb; --muted: #9099a6; --grid: #2c323b;
      --border: #3a414c; --accent: #63a4ff; --accent-text: #0b1220;
      --x: #ff6b70; --y: #4cd08a; --z: #63a4ff; --sp: #e6e8eb;
    }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  #status, #rate { color: var(--muted); }
  .panels { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .panels + .panels { margin-top: 16px; }
  .panel { background: var(--panel); border-radius: 8px; padding: 12px 16px; min-width: 0; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  .panel h2 span { color: var(--muted); font-weight: normal; }
  .values { display: flex; gap: 16px; font: 16px ui-monospace, Consolas, monospace; margin-bottom: 8px; }
  .values div { flex: 1; white-space: nowrap; }
  .x { color: var(--x); } .y { color: var(--y); } .z { color: var(--z); } .sp { color: var(--sp); }
  canvas { display: block; width: 100%; height: 160px; }

  /* PID view */
  .readouts { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .readouts div { display: flex; flex-direction: column; }
  .readouts span { color: var(--muted); font-size: 12px; }
  .readouts b { font: 600 22px ui-monospace, Consolas, monospace; white-space: nowrap; }
  .legend { display: flex; gap: 16px; font-size: 12px; margin-bottom: 4px; }
  .legend .dashed::before { content: "- - "; }
  .legend .solid::before { content: "── "; }
  .controls { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input { font: inherit; color: inherit; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:hover { filter: brightness(0.95); }
  input[type=number] { width: 80px; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border);
                       background: var(--bg); }
  .gains { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .gains label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
  .gains input { width: auto; color: var(--text); }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  #log { margin: 0; padding: 0; list-style: none; max-height: 260px; overflow-y: auto;
         font: 13px ui-monospace, Consolas, monospace; }
  #log li { padding: 3px 0; border-bottom: 1px solid var(--grid); }
  #log li.done { color: var(--y); } #log li.fail { color: var(--x); }
  #log time { color: var(--muted); margin-right: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="title">ESP32 Dashboard</h1>
  <span id="status">Connecting to server...</span>
  <span id="rate"></span>
  <span id="temp"></span>
</header>

<!-- Shown for the IMU firmware (samples with "a", "g", "m"). -->
<div id="imu-view" class="panels" hidden>
  <section class="panel">
    <h2>Accelerometer <span>mg</span></h2>
    <div class="values" data-key="a" data-digits="0"><div class="x"></div><div class="y"></div><div class="z"></div></div>
    <canvas data-chart="a"></canvas>
  </section>
  <section class="panel">
    <h2>Gyroscope <span>°/s</span></h2>
    <div class="values" data-key="g" data-digits="1"><div class="x"></div><div class="y"></div><div class="z"></div></div>
    <canvas data-chart="g"></canvas>
  </section>
  <section class="panel">
    <h2>Magnetometer <span>µT</span></h2>
    <div class="values" data-key="m" data-digits="1"><div class="x"></div><div class="y"></div><div class="z"></div></div>
    <canvas data-chart="m"></canvas>
  </section>
</div>

<!-- Shown for the PID firmware (samples with "sp", "yaw", "rate", "u"). -->
<div id="pid-view" hidden>
  <div class="panels">
    <section class="panel readouts">
      <div><span>Setpoint</span><b id="r-sp">–</b></div>
      <div><span>Angle</span><b id="r-yaw" class="z">–</b></div>
      <div><span>Error</span><b id="r-err" class="x">–</b></div>
      <div><span>Rate</span><b id="r-rate">–</b></div>
      <div><span>Motor output</span><b id="r-u" class="y">–</b></div>
    </section>
  </div>

  <div class="panels">
    <section class="panel">
      <h2>Angle <span>degrees</span></h2>
      <div class="legend"><span class="sp dashed">Setpoint</span><span class="z solid">Angle</span></div>
      <canvas data-chart="angle"></canvas>
    </section>
    <section class="panel">
      <h2>Error <span>setpoint − angle, degrees</span></h2>
      <canvas data-chart="error"></canvas>
    </section>
    <section class="panel">
      <h2>Motor output <span>−1 to 1</span></h2>
      <canvas data-chart="output"></canvas>
    </section>
    <section class="panel">
      <h2>Rate <span>°/s</span></h2>
      <canvas data-chart="rate"></canvas>
    </section>
  </div>

  <div class="panels">
    <section class="panel controls">
      <h2>Controls</h2>
      <div class="row">
        <button class="primary" data-command="step">Step +90°</button>
        <form id="go-form" class="row">
          <input id="go-target" type="number" step="any" value="0" aria-label="Target angle">
          <button>Go to angle</button>
        </form>
      </div>
      <div class="row">
        <button data-command="zero">Zero angle</button>
        <button data-command="cal">Calibrate gyro</button>
        <label><input id="sim" type="checkbox"> Simulated motor</label>
      </div>
      <form id="gains-form" class="controls">
        <div class="gains">
          <label>Kp <input name="kp" type="number" step="any"></label>
          <label>Ki <input name="ki" type="number" step="any"></label>
          <label>Kd <input name="kd" type="number" step="any"></label>
          <label>Min output <input name="min" type="number" step="any" min="0" max="1"></label>
        </div>
        <div class="row">
          <button class="primary">Apply gains</button>
          <p class="hint">Gains reset when the ESP32 restarts.</p>
        </div>
      </form>
    </section>
    <section class="panel">
      <h2>Moves</h2>
      <ol id="log"></ol>
    </section>
  </div>
</div>

<script>
const HISTORY = 300;  // samples kept per chart (6 s of IMU data at 50 Hz, 15 s of PID data at 20 Hz)
const AXES = ["x", "y", "z"];
const xyz = key => AXES.map((axis, i) => ({ color: axis, get: s => s[key][i] }));

// Each chart plots one or more series from the shared sample history.
// `range` fixes the y axis; otherwise it fits the data, spanning at least `minSpan`.
const CHARTS = {
  a: { series: xyz("a") },
  g: { series: xyz("g") },
  m: { series: xyz("m") },
  angle: { series: [{ color: "sp", get: s => s.sp, dashed: true }, { color: "z", get: s => s.yaw }], minSpan: 10 },
  error: { series: [{ color: "x", get: s => s.sp - s.yaw }], minSpan: 4, zero: true },
  output: { series: [{ color: "y", get: s => s.u }], range: [-1.05, 1.05], digits: 1 },
  rate: { series: [{ color: "z", get: s => s.rate }], minSpan: 20 },
};
for (const canvas of document.querySelectorAll("canvas[data-chart]")) {
  CHARTS[canvas.dataset.chart].canvas = canvas;
}

const $ = id => document.getElementById(id);
const statusEl = $("status"), rateEl = $("rate"), tempEl = $("temp");
const views = { imu: $("imu-view"), pid: $("pid-view") };
const TITLES = { imu: "ICM-20948 IMU", pid: "PID Test" };

let mode = null;
let history = [];
let latest = null;
let dirty = false;
let sampleCount = 0;

function drawChart(chart) {
  const canvas = chart.canvas;
  if (canvas.offsetParent === null) return;  // in the hidden view
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr;
    canvas.height = h * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;

  const style = getComputedStyle(document.documentElement);
  let min, max;
  if (chart.range) {
    [min, max] = chart.range;
  } else {
    min = Infinity; max = -Infinity;
    for (const s of history) for (const series of chart.series) {
      const n = series.get(s);
      if (n < min) min = n;
      if (n > max) max = n;
    }
    if (chart.zero) { min = Math.min(min, 0); max = Math.max(max, 0); }
    const span = Math.max(max - min, chart.minSpan || 0);
    const mid = (max + min) / 2;
    const pad = Math.max(span * 0.1, 1);
    min = mid - span / 2 - pad; max = mid + span / 2 + pad;
  }
  const yOf = n => h - (n - min) / (max - min) * h;

  // Zero line and range labels.
  ctx.strokeStyle = style.getPropertyValue("--grid");
  ctx.lineWidth = 1;
  if (min < 0 && max > 0) {
    ctx.beginPath(); ctx.moveTo(0, yOf(0)); ctx.lineTo(w, yOf(0)); ctx.stroke();
  }
  const digits = chart.digits || 0;
  ctx.fillStyle = style.getPropertyValue("--muted");
  ctx.font = "11px system-ui, sans-serif";
  ctx.textBaseline = "top";    ctx.fillText(max.toFixed(digits), 2, 2);
  ctx.textBaseline = "bottom"; ctx.fillText(min.toFixed(digits), 2, h - 2);

  ctx.lineWidth = 1.5;
  for (const series of chart.series) {
    ctx.strokeStyle = style.getPropertyValue("--" + series.color);
    ctx.setLineDash(series.dashed ? [6, 4] : []);
    ctx.beginPath();
    history.forEach((s, j) => {
      const x = j / (HISTORY - 1) * w;
      if (j === 0) ctx.moveTo(x, yOf(series.get(s))); else ctx.lineTo(x, yOf(series.get(s)));
    });
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

const signed = (n, digits) => (n >= 0 ? "+" : "−") + Math.abs(n).toFixed(digits);

function renderValues() {
  if (mode === "imu") {
    for (const el of document.querySelectorAll(".values")) {
      [...el.children].forEach((cell, i) => {
        cell.textContent = AXES[i].toUpperCase() + " " +
          latest[el.dataset.key][i].toFixed(Number(el.dataset.digits)).padStart(8);
      });
    }
    tempEl.textContent = latest.temp.toFixed(1) + " °C";
  } else {
    $("r-sp").textContent = latest.sp.toFixed(1) + "°";
    $("r-yaw").textContent = latest.yaw.toFixed(2) + "°";
    $("r-err").textContent = signed(latest.sp - latest.yaw, 2) + "°";
    $("r-rate").textContent = signed(latest.rate, 1) + " °/s";
    $("r-u").textContent = signed(latest.u, 3);
  }
}

function render() {
  requestAnimationFrame(render);
  if (!dirty) return;
  dirty = false;
  renderValues();
  for (const chart of Object.values(CHARTS)) drawChart(chart);
}
requestAnimationFrame(render);

setInterval(() => {
  rateEl.textContent = sampleCount + " Hz";
  sampleCount = 0;
}, 1000);

function setMode(newMode) {
  mode = newMode;
  history = [];
  for (const [name, el] of Object.entries(views)) el.hidden = name !== mode;
  $("title").textContent = document.title = TITLES[mode];
  tempEl.textContent = "";
  if (mode === "pid") sendCommand("show");  // fills in the gain fields
}

// Commands go to the ESP32 through server.py, one line each.
async function sendCommand(command) {
  try {
    const res = await fetch("/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command }),
    });
    if (!res.ok) statusEl.textContent = `Command "${command}" failed: ${res.status} ${res.statusText}`;
  } catch (err) {
    statusEl.textContent = `Command "${command}" failed: ${err.message}`;
  }
}

for (const button of document.querySelectorAll("button[data-command]")) {
  button.addEventListener("click", () => sendCommand(button.dataset.command));
}
$("go-form").addEventListener("submit", e => {
  e.preventDefault();
  const target = Number($("go-target").value);
  if (Number.isFinite(target)) sendCommand("go " + target);
});
$("sim").addEventListener("change", e => sendCommand("sim " + (e.target.checked ? 1 : 0)));

const gainsForm = $("gains-form");
gainsForm.addEventListener("submit", async e => {
  e.preventDefault();
  for (const input of gainsForm.elements) {
    if (input.name && input.value !== "" && input.value !== input.dataset.current) {
      await sendCommand(`${input.name} ${Number(input.value)}`);
    }
  }
});

// The firmware's settings line, e.g. "kp 0.0300  ki 0.0200  kd 0.0020  min 0.100  sim 0  stream 1".
function applySettings(message) {
  const settings = {};
  for (const [, key, value] of message.matchAll(/(\w+) (-?[\d.]+)/g)) settings[key] = value;
  for (const input of gainsForm.elements) {
    if (!(input.name in settings)) continue;
    const value = String(Number(settings[input.name]));
    input.dataset.current = value;
    if (document.activeElement !== input) input.value = value;
  }
  if ("sim" in settings) $("sim").checked = settings.sim === "1";
}

function addLog(message) {
  const item = document.createElement("li");
  if (message.startsWith("reached")) item.className = "done";
  else if (message.startsWith("did not settle") || message.startsWith("no data")) item.className = "fail";
  const time = document.createElement("time");
  time.textContent = new Date().toLocaleTimeString();
  item.append(time, message);
  const log = $("log");
  log.prepend(item);
  while (log.children.length > 50) log.lastChild.remove();
}

const events = new EventSource("/events");
events.addEventListener("imu", e => {
  latest = JSON.parse(e.data);
  const sampleMode = "sp" in latest ? "pid" : "a" in latest ? "imu" : null;
  if (!sampleMode) return;
  if (sampleMode !== mode) setMode(sampleMode);
  history.push(latest);
  if (history.length > HISTORY) history.shift();
  sampleCount++;
  dirty = true;
});
events.addEventListener("log", e => {
  const message = JSON.parse(e.data);
  if (message.startsWith("kp ")) applySettings(message);
  else addLog(message);
});
events.addEventListener("status", e => { statusEl.textContent = JSON.parse(e.data); });
events.onerror = () => { statusEl.textContent = "Lost connection to server.py, retrying..."; };
</script>
</body>
</html>
